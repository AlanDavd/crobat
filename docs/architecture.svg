<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 970" width="1800" height="970" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Crobat architecture: a distributed job scheduler where the MySQL jobs table is the queue</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#FEF2F2"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#FCA5A5" stroke-width="4"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1800" height="970" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="60" y="78" font-size="38" font-weight="700" fill="#0F172A">crobat</text>
  <text x="196" y="78" font-size="38" font-weight="400" fill="#64748B">distributed job scheduler</text>
  <text x="60" y="116" font-size="20" fill="#475569">Cron as a service in Go. No broker: the MySQL jobs table is the queue.</text>

  <!-- Legend -->
  <g font-size="16" fill="#334155">
    <rect x="1230" y="56" width="18" height="18" rx="4" fill="#FFF4EC" stroke="#F97316" stroke-width="2"/>
    <text x="1258" y="71">API</text>
    <rect x="1320" y="56" width="18" height="18" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1348" y="71">Scheduling</text>
    <rect x="1462" y="56" width="18" height="18" rx="4" fill="#EEF4FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1490" y="71">Execution &amp; data</text>
    <rect x="1230" y="92" width="18" height="18" rx="4" fill="url(#hatch)" stroke="#DC2626" stroke-width="2"/>
    <text x="1258" y="107">Security boundary</text>
    <line x1="1462" y1="101" x2="1500" y2="101" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1510" y="107">Read path</text>
  </g>

  <g transform="translate(0,-90)">
  <!-- Tenants -->
  <g transform="translate(70,470)">
    <circle cx="60" cy="22" r="18" fill="#E2E8F0"/>
    <path d="M28,78 a32,30 0 0 1 64,0 z" fill="#E2E8F0"/>
    <circle cx="28" cy="40" r="13" fill="#CBD5E1"/>
    <path d="M6,90 a22,22 0 0 1 44,0 z" fill="#CBD5E1"/>
    <circle cx="92" cy="40" r="13" fill="#CBD5E1"/>
    <path d="M70,90 a22,22 0 0 1 44,0 z" fill="#CBD5E1"/>
    <text x="60" y="122" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">Tenants</text>
    <text x="60" y="144" font-size="14" fill="#64748B" text-anchor="middle">CLI / REST + JWT</text>
  </g>

  <!-- Task API -->
  <g filter="url(#shadow)">
    <rect x="260" y="318" width="260" height="104" rx="14" fill="#FFF4EC" stroke="#F97316" stroke-width="2"/>
  </g>
  <text x="390" y="356" font-size="20" font-weight="700" fill="#9A3412" text-anchor="middle">Task Service</text>
  <text x="390" y="382" font-size="14" fill="#7C2D12" text-anchor="middle">create · edit · pause · delete</text>
  <text x="390" y="403" font-size="14" fill="#7C2D12" text-anchor="middle">Idempotency-Key on POST</text>

  <!-- Job API -->
  <g filter="url(#shadow)">
    <rect x="260" y="640" width="260" height="104" rx="14" fill="#FFF4EC" stroke="#F97316" stroke-width="2"/>
  </g>
  <text x="390" y="678" font-size="20" font-weight="700" fill="#9A3412" text-anchor="middle">Job Service</text>
  <text x="390" y="704" font-size="14" fill="#7C2D12" text-anchor="middle">status · history · DLQ</text>
  <text x="390" y="725" font-size="14" fill="#7C2D12" text-anchor="middle">manual retry</text>

  <!-- Tenants to APIs -->
  <path d="M200,520 C230,520 225,370 256,370" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M200,560 C230,560 225,692 256,692" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MySQL container -->
  <rect x="600" y="250" width="480" height="540" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="630" y="290" font-size="22" font-weight="700" fill="#0F172A">MySQL</text>
  <text x="712" y="290" font-size="16" fill="#64748B">single source of truth</text>

  <!-- tasks table -->
  <g filter="url(#shadow)">
    <rect x="630" y="312" width="420" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <rect x="630" y="312" width="420" height="40" rx="12" fill="#F1F5F9"/>
  <rect x="630" y="340" width="420" height="12" fill="#F1F5F9"/>
  <text x="650" y="339" font-size="17" font-weight="700" fill="#0F172A">tasks</text>
  <text x="706" y="339" font-size="15" fill="#64748B">the configuration</text>
  <g font-size="14" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">
    <text x="650" y="380">schedule: now | at | cron + timezone</text>
    <text x="650" y="404">priority · request (encrypted secrets)</text>
    <text x="650" y="428">timeout · retry policy · next_run_at</text>
    <text x="650" y="450" fill="#64748B">status: active | paused | deleted</text>
  </g>

  <!-- jobs table -->
  <g filter="url(#shadow)">
    <rect x="630" y="492" width="420" height="270" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <rect x="631" y="493" width="418" height="40" rx="11" fill="#EEF4FF"/>
  <rect x="631" y="521" width="418" height="12" fill="#EEF4FF"/>
  <text x="650" y="520" font-size="17" font-weight="700" fill="#1E3A8A">jobs</text>
  <text x="698" y="520" font-size="15" fill="#1D4ED8">hot table = the queue</text>
  <g font-size="14" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">
    <text x="650" y="562">id = Idempotency-Key</text>
    <text x="650" y="586">request copied from the task</text>
    <text x="650" y="610">status: pending → running →</text>
    <text x="768" y="632">succeeded | dead (DLQ)</text>
    <text x="650" y="656">attempt  ← fencing token</text>
    <text x="650" y="680">worker_id · lease_expires_at</text>
  </g>
  <rect x="650" y="700" width="380" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="840" y="719" font-size="13" fill="#334155" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">UPDATE … WHERE status='running'</text>
  <text x="840" y="736" font-size="13" fill="#334155" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">AND worker_id=? AND attempt=?</text>

  <!-- APIs to MySQL -->
  <path d="M520,370 L626,380" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M520,676 L626,640" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- Scheduler -->
  <g filter="url(#shadow)">
    <rect x="1170" y="300" width="270" height="118" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="1305" y="338" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Scheduler</text>
  <text x="1305" y="364" font-size="14" fill="#4C1D95" text-anchor="middle">every 5 s: tasks due in next 30 s</text>
  <text x="1305" y="386" font-size="14" fill="#4C1D95" text-anchor="middle">→ INSERT jobs + advance next_run_at</text>
  <text x="1305" y="406" font-size="14" fill="#4C1D95" text-anchor="middle">in one transaction</text>
  <path d="M1050,360 L1166,360" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1108" y="350" font-size="13" fill="#6D28D9" text-anchor="middle">due tasks</text>
  <path d="M1250,418 C1250,480 1120,520 1054,530" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1240" y="482" font-size="13" fill="#6D28D9">INSERT pending</text>

  <!-- Executors (stacked) -->
  <rect x="1186" y="562" width="270" height="118" rx="14" fill="#E0EAFF" stroke="#93B4F5" stroke-width="1.5"/>
  <rect x="1178" y="572" width="270" height="118" rx="14" fill="#E8F0FF" stroke="#93B4F5" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="1170" y="582" width="270" height="118" rx="14" fill="#EEF4FF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="1305" y="618" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">Executors × N</text>
  <text x="1305" y="644" font-size="14" fill="#1E3A8A" text-anchor="middle">claim with FOR UPDATE SKIP LOCKED</text>
  <text x="1305" y="666" font-size="14" fill="#1E3A8A" text-anchor="middle">commit, wait on own timer, call</text>
  <text x="1305" y="688" font-size="14" fill="#1E3A8A" text-anchor="middle">save only if still the owner</text>
  <path d="M1054,612 L1166,612" fill="none" stroke="#2563EB" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1110" y="602" font-size="13" fill="#1D4ED8" text-anchor="middle">claim / save</text>

  <!-- SSRF guard -->
  <rect x="1478" y="566" width="56" height="150" rx="10" fill="url(#hatch)" stroke="#DC2626" stroke-width="2"/>
  <text x="1506" y="641" font-size="15" font-weight="700" fill="#991B1B" text-anchor="middle" transform="rotate(-90 1506 641)">SSRF guard</text>
  <text x="1506" y="740" font-size="12" fill="#991B1B" text-anchor="middle">public IPs</text>
  <text x="1506" y="756" font-size="12" fill="#991B1B" text-anchor="middle">:80 / :443</text>
  <text x="1506" y="772" font-size="12" fill="#991B1B" text-anchor="middle">no redirects</text>
  <path d="M1440,641 L1474,641" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tenant endpoints -->
  <text x="1660" y="520" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Tenant endpoints</text>
  <g font-size="13" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">
    <rect x="1572" y="540" width="180" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="1592" cy="562" r="5" fill="#22C55E"/>
    <text x="1606" y="567">POST /orders</text>
    <rect x="1572" y="596" width="180" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="1592" cy="618" r="5" fill="#22C55E"/>
    <text x="1606" y="623">POST /invoices</text>
    <rect x="1572" y="652" width="180" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="1592" cy="674" r="5" fill="#22C55E"/>
    <text x="1606" y="679">POST /reports</text>
  </g>
  <path d="M1534,641 L1566,641" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1662" y="726" font-size="13" fill="#64748B" text-anchor="middle">each dedupes by</text>
  <text x="1662" y="744" font-size="13" fill="#64748B" text-anchor="middle">Idempotency-Key</text>

  <!-- Reconciler -->
  <g filter="url(#shadow)">
    <rect x="600" y="840" width="260" height="96" rx="14" fill="#EEF4FF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="730" y="876" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">Reconciler</text>
  <text x="730" y="902" font-size="14" fill="#1E3A8A" text-anchor="middle">expired lease → pending | dead</text>
  <text x="730" y="922" font-size="14" fill="#1E3A8A" text-anchor="middle">rescues jobs of dead executors</text>
  <path d="M730,836 L730,766" fill="none" stroke="#2563EB" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Archiver -->
  <g filter="url(#shadow)">
    <rect x="900" y="840" width="260" height="96" rx="14" fill="#EEF4FF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="1030" y="876" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">Archiver</text>
  <text x="1030" y="902" font-size="14" fill="#1E3A8A" text-anchor="middle">finished jobs: write history first,</text>
  <text x="1030" y="922" font-size="14" fill="#1E3A8A" text-anchor="middle">then delete from MySQL</text>
  <path d="M960,766 L990,836" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cassandra -->
  <g filter="url(#shadow)">
    <rect x="1240" y="840" width="300" height="96" rx="14" fill="#ECFEFF" stroke="#0E7490" stroke-width="2"/>
  </g>
  <text x="1390" y="876" font-size="20" font-weight="700" fill="#155E75" text-anchor="middle">Cassandra</text>
  <text x="1390" y="902" font-size="14" fill="#164E63" text-anchor="middle">append-only history, 30-day TTL</text>
  <text x="1390" y="922" font-size="14" fill="#164E63" text-anchor="middle">tenant · task · month partitions</text>
  <path d="M1160,888 L1236,888" fill="none" stroke="#0E7490" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Job Service reads history -->
  <path d="M390,744 L390,985 L1390,985 L1390,940" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="560" y="977" font-size="13" fill="#64748B">reads history (merged with MySQL, deduped by job id)</text>

  <!-- Footer -->
  <line x1="60" y1="1012" x2="1740" y2="1012" stroke="#E2E8F0" stroke-width="1.5"/>
  <g font-size="15" fill="#475569">
    <text x="60" y="1042"><tspan font-weight="700" fill="#0F172A">At-least-once</tspan> delivery · lease + fencing token · headers on every call: Idempotency-Key · X-Scheduled-At · X-Attempt</text>
    <text x="1740" y="1042" text-anchor="end">Priorities: critical · high · normal · low</text>
  </g>
  </g>
</svg>
